[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skilllatch"
version = "0.1.0"
description = "Host-mediated capability decisions for approved agent skills"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
skilllatch = "skilllatch.__main__:main"

[tool.setuptools.packages.find]
include = ["skilllatch*"]
