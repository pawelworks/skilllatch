name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m skilllatch digest --skill-dir examples/chef-helper
      - run: python -m skilllatch check --skill-dir examples/chef-helper --workspace examples/workspace --manifest examples/manifest.json --grant examples/grant.json --request examples/allowed-request.json --at 2026-10-01T12:00:00Z
